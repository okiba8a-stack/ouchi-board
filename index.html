<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おうちボード</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="おうちボード">
<meta name="theme-color" content="#eef1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Lexend:wght@200;300;400&display=swap">
<style>
:root {
  --bg: #eef1ee; --panel: #ffffff; --ink: #1d2622; --muted: #66736d; --line: #d6ddd8;
  --accent: #2f7a5f; --accent-soft: #dcebe4; --rain: #3c6fa8; --sun: #c98a16; --warn: #b5532f;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "Lexend", "Zen Kaku Gothic New", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --panel: #19201d; --ink: #e4ebe7; --muted: #8d9a94; --line: #2a3430;
    --accent: #6cc39f; --accent-soft: #1f3a2f; --rain: #7fa9dc; --sun: #e5b555; --warn: #e48a66;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --panel: #19201d; --ink: #e4ebe7; --muted: #8d9a94; --line: #2a3430;
  --accent: #6cc39f; --accent-soft: #1f3a2f; --rain: #7fa9dc; --sun: #e5b555; --warn: #e48a66;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  transition: filter .6s; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body.night { filter: brightness(.55); }
.board {
  display: grid; gap: 16px; max-width: 1400px; margin: 0 auto; min-height: 100%;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: 1fr auto;
  grid-template-areas: "now plans routine" "news news news";
}
@media (max-width: 1000px) {
  .board { grid-template-columns: minmax(0,1fr) minmax(0,1fr); grid-template-rows: auto; grid-template-areas: "now now" "plans routine" "news news"; }
}
@media (max-width: 640px) {
  .board { grid-template-columns: minmax(0,1fr); grid-template-areas: "now" "routine" "plans" "news"; }
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h2 small { font-weight: 400; letter-spacing: 0; font-size: 12px; }

/* 時計と天気 */
.now { grid-area: now; }
.clock { font-family: var(--font-num); font-weight: 200; font-size: clamp(64px, 9vw, 120px); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.date { font-size: 20px; font-weight: 500; }
.date .wd { color: var(--accent); }
.date .sub { color: var(--muted); font-size: 14px; font-weight: 400; margin-left: 8px; }
.wx-days { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wx-day { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: 52px 1fr; gap: 4px 12px; align-items: center; }
.wx-day .icon { grid-row: span 3; width: 52px; height: 52px; }
.wx-day .lbl { font-size: 13px; color: var(--muted); }
.wx-day .desc { font-weight: 700; }
.temps { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; }
.temps .hi { color: var(--warn); } .temps .lo { color: var(--rain); }
.pop { font-size: 13px; color: var(--muted); }
.pop b { font-family: var(--font-num); font-weight: 400; color: var(--rain); font-size: 15px; }
.hours { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; text-align: center; font-size: 12px; color: var(--muted); }
.hours .icon { width: 26px; height: 26px; margin: 2px auto; display: block; }
.hours .t { font-family: var(--font-num); color: var(--ink); font-size: 14px; }
.hours .p { font-family: var(--font-num); color: var(--rain); }
.comment { font-size: 14px; background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; }
.place { font-size: 12px; color: var(--muted); margin-top: auto; }
.icon .sun { fill: var(--sun); } .icon .cloud { fill: var(--muted); opacity: .55; } .icon .drop { fill: var(--rain); } .icon .snow { fill: var(--rain); opacity: .7; } .icon .bolt { fill: var(--sun); }

/* 予定 */
.plans { grid-area: plans; }
.ev-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ev { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 12px; align-items: start; }
.ev .time { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; color: var(--accent); padding-top: 1px; white-space: pre-line; }
.ev .time.allday { font-family: var(--font-body); font-size: 12px; }
.ev .ttl { font-weight: 500; overflow-wrap: anywhere; }
.ev .loc { font-size: 12px; color: var(--muted); }
.ev.past { opacity: .45; }
.ev.nowon .time::after { content: "いま"; display: inline-block; margin-left: 4px; font-family: var(--font-body); font-size: 10px; color: var(--panel); background: var(--accent); border-radius: 4px; padding: 0 4px; vertical-align: 2px; }
.upcoming .ev .time { color: var(--muted); font-family: var(--font-body); font-size: 13px; }
.sep { border-top: 1px dashed var(--line); }
.empty { color: var(--muted); font-size: 14px; }

/* 覚えておいて */
.remember { display: flex; flex-direction: column; gap: 8px; }
.rm-row { display: flex; gap: 8px; }
.rm-row input[type=text] { flex: 1; min-width: 0; }
input, .btn { font: inherit; font-size: 16px; }
input[type=text], input[type=datetime-local], input[type=url] {
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.btn { color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 10px; padding: 8px 14px; min-height: 44px; cursor: pointer; white-space: nowrap; }
.btn.primary { color: var(--panel); background: var(--accent); }
.btn:disabled { opacity: .5; }
.btn.mic[aria-pressed="true"] { color: var(--panel); background: var(--warn); }
.btn:focus-visible, .chk:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rm-preview { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.rm-preview .what { font-weight: 700; overflow-wrap: anywhere; }
.rm-msg { font-size: 13px; color: var(--muted); min-height: 1em; }
.rm-msg.err { color: var(--warn); }

/* ルーティン */
.routine { grid-area: routine; }
.progress { height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }
.chk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.chk { width: 100%; display: flex; align-items: center; gap: 14px; font: inherit; font-size: 18px; color: var(--ink); text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-height: 56px; }
.chk .box { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.chk .box svg { width: 18px; height: 18px; stroke: var(--panel); stroke-width: 3; fill: none; opacity: 0; }
.chk[aria-pressed="true"] { color: var(--muted); }
.chk[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.chk[aria-pressed="true"] .box svg { opacity: 1; }
.chk[aria-pressed="true"] .label { text-decoration: line-through; text-decoration-color: var(--line); }
.chk .when { margin-left: auto; font-size: 12px; color: var(--muted); }
.allclear { text-align: center; color: var(--accent); font-weight: 700; padding: 8px; }
.hint { font-size: 12px; color: var(--muted); margin-top: auto; }

/* ニュース */
.news { grid-area: news; }
.news-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 24px; }
.news-list li { min-width: 0; border-left: 2px solid var(--accent-soft); padding-left: 10px; }
.news-list a { color: var(--ink); text-decoration: none; font-weight: 500; }
.news-list p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }

/* 状態・設定 */
.status { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); font-size: 11px; color: var(--muted); }
.status button { font: inherit; color: inherit; background: none; border: 0; padding: 4px; cursor: pointer; }
.setup { max-width: 560px; margin: 8vh auto 0; }
.setup label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
.setup p { margin: 0; font-size: 14px; }
.setup .ok { color: var(--accent); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<section class="panel setup" id="setup" hidden aria-label="初回設定">
  <h2>はじめの設定</h2>
  <p>Google Apps Script で公開した「ウェブアプリのURL」と「合言葉」を入れてください。手順は docs/設定手順.md にあります。</p>
  <label>ウェブアプリのURL<input type="url" id="cfgApi" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
  <label>合言葉<input type="text" id="cfgKey" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <div class="rm-row"><button class="btn primary" type="button" id="cfgSave">保存してつなぐ</button><button class="btn" type="button" id="cfgCancel" hidden>やめる</button></div>
  <p class="rm-msg" id="cfgMsg"></p>
</section>

<div class="board" id="board" hidden>
  <section class="panel now" aria-label="時計と天気">
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="wx-days" id="wxDays"><p class="empty">天気を読み込み中…</p></div>
    <div class="hours" id="hours"></div>
    <div class="comment" id="comment" hidden></div>
    <div class="place" id="place"></div>
  </section>

  <section class="panel plans" aria-label="予定">
    <h2>覚えておいて</h2>
    <form class="remember" id="rmForm" autocomplete="off">
      <div class="rm-row">
        <input type="text" id="rmText" placeholder="例：1週間後にパンチェッタのラップを外す" enterkeyhint="done">
        <button class="btn mic" type="button" id="rmMic" hidden aria-pressed="false" aria-label="声で入力">🎤</button>
      </div>
      <div class="rm-preview" id="rmPreview" hidden>
        <div class="what" id="rmWhat"></div>
        <input type="datetime-local" id="rmWhen" aria-label="日時">
        <div class="rm-row"><button class="btn primary" type="submit" id="rmAdd">カレンダーに登録</button><button class="btn" type="button" id="rmClear">やめる</button></div>
      </div>
      <div class="rm-msg" id="rmMsg"></div>
    </form>
    <div class="sep"></div>
    <h2>きょうの予定 <small id="calState"></small></h2>
    <ul class="ev-list" id="today"><li class="empty">読み込み中…</li></ul>
    <div class="sep"></div>
    <h2>この先1週間</h2>
    <ul class="ev-list upcoming" id="upcoming"></ul>
  </section>

  <section class="panel routine" aria-label="きょうのルーティン">
    <h2>きょうのルーティン <small id="rCount"></small></h2>
    <div class="progress"><i id="rBar"></i></div>
    <ul class="chk-list" id="routines"><li class="empty">読み込み中…</li></ul>
    <p class="hint">タップでチェック。ルーティンの追加・変更は、Googleスプレッドシート「おうちボード データ」の routines シートで行えます。</p>
  </section>

  <section class="panel news" aria-label="ニュース">
    <h2>ニュース <small id="newsAt"></small></h2>
    <ul class="news-list" id="news"><li class="empty">読み込み中…</li></ul>
  </section>
</div>

<div class="status" id="status" hidden><span id="statusText"></span> <button type="button" id="openSetup">設定</button></div>

<script src="remind-parse.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const WD = ["日","月","火","水","木","金","土"];
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const hm = (d) => `${d.getHours()}:${pad(d.getMinutes())}`;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  /* ---------- 設定（URL の ?c= か、保存済みのもの） ---------- */
  const params = new URLSearchParams(location.search);
  const DEMO = params.get("demo") === "1";
  function decodeCfg(s) {
    try { const j = JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))))); return j && j.api && j.key ? j : null; } catch (e) { return null; }
  }
  function encodeCfg(c) { return btoa(unescape(encodeURIComponent(JSON.stringify(c)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  let cfg = (params.get("c") && decodeCfg(params.get("c"))) || store.get("ouchi.cfg");
  if (cfg) store.set("ouchi.cfg", cfg);

  function showSetup(canCancel) {
    $("board").hidden = true; $("status").hidden = true; $("setup").hidden = false;
    $("cfgCancel").hidden = !canCancel;
    if (cfg) { $("cfgApi").value = cfg.api; $("cfgKey").value = cfg.key; }
  }
  function showBoard() { $("setup").hidden = true; $("board").hidden = false; $("status").hidden = false; }

  $("cfgSave").addEventListener("click", async () => {
    const api = $("cfgApi").value.trim(), key = $("cfgKey").value.trim();
    const msg = $("cfgMsg"); msg.className = "rm-msg";
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(api) || !key) { msg.textContent = "URL（…/exec で終わるもの）と合言葉を入れてください。"; msg.classList.add("err"); return; }
    msg.textContent = "つないでいます…";
    try {
      const r = await callApi({ action: "ping" }, { api, key });
      if (!r.ok) throw new Error(r.error === "bad_key" ? "合言葉が違います" : r.error);
      cfg = { api, key }; store.set("ouchi.cfg", cfg);
      // この URL のままホーム画面に追加すると、アプリ側にも設定が入る
      history.replaceState(null, "", location.pathname + "?c=" + encodeCfg(cfg));
      msg.innerHTML = '<span class="ok">つながりました。</span> Safari で見ている場合は、このまま 共有 →「ホーム画面に追加」をしてください。';
      setTimeout(() => { showBoard(); refresh(); }, 1500);
    } catch (e) { msg.textContent = "つなげませんでした：" + e.message; msg.classList.add("err"); }
  });
  $("cfgCancel").addEventListener("click", showBoard);
  $("openSetup").addEventListener("click", () => showSetup(true));

  /* ---------- 裏方（Apps Script）を呼ぶ ---------- */
  async function callApi(q, c) {
    c = c || cfg;
    const u = new URL(c.api);
    Object.entries({ ...q, key: c.key }).forEach(([k, v]) => u.searchParams.set(k, v));
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 20000);
    try {
      const res = await fetch(u.toString(), { redirect: "follow", signal: ctl.signal });
      if (!res.ok) throw new Error("通信エラー " + res.status);
      return await res.json();
    } finally { clearTimeout(timer); }
  }

  /* ---------- 時計 ---------- */
  let today = ymd(new Date());
  function tick() {
    const d = new Date();
    $("clock").textContent = hm(d);
    const dEl = $("date"); dEl.textContent = "";
    dEl.append(`${d.getMonth()+1}月${d.getDate()}日 `, el("span", "wd", `${WD[d.getDay()]}曜日`), el("span", "sub", `令和${d.getFullYear()-2018}年`));
    const h = d.getHours();
    document.body.classList.toggle("night", h >= 23 || h < 6);
    if (ymd(d) !== today) { today = ymd(d); checks = {}; render(); refresh(); }
  }
  tick(); setInterval(tick, 10000);

  // 画面をつけたままにする（対応している端末だけ）
  let lock = null;
  async function wake() { try { if (navigator.wakeLock && document.visibilityState === "visible" && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch (e) {} }
  document.addEventListener("visibilitychange", () => { wake(); if (document.visibilityState === "visible") refresh(); });
  document.addEventListener("click", wake, { once: true });
  wake();

  /* ---------- 天気アイコン ---------- */
  const WX = (c) => {
    if (c === 0) return ["快晴", "sun"]; if (c === 1) return ["晴れ", "sun"]; if (c === 2) return ["晴れ時々くもり", "part"]; if (c === 3) return ["くもり", "cloud"];
    if (c === 45 || c === 48) return ["霧", "cloud"]; if (c >= 51 && c <= 57) return ["霧雨", "rain"]; if (c >= 61 && c <= 67) return [c >= 65 ? "強い雨" : "雨", "rain"];
    if (c >= 71 && c <= 77) return ["雪", "snow"]; if (c >= 80 && c <= 82) return ["にわか雨", "rain"]; if (c === 85 || c === 86) return ["にわか雪", "snow"];
    if (c >= 95) return ["雷雨", "storm"]; return ["—", "cloud"];
  };
  const NS = "http://www.w3.org/2000/svg";
  function icon(kind) {
    const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 48 48"); s.setAttribute("class", "icon"); s.setAttribute("aria-hidden", "true");
    const add = (tag, attrs, c) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); e.setAttribute("class", c); s.append(e); };
    const cloud = (dx = 0, dy = 0) => add("path", { d: `M${14+dx} ${34+dy}h22a8 8 0 0 0 0-16a11 11 0 0 0-21 3a6.5 6.5 0 0 0-1 13z` }, "cloud");
    if (kind === "sun") { add("circle", { cx: 24, cy: 24, r: 10 }, "sun"); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; add("circle", { cx: 24 + 16 * Math.cos(a), cy: 24 + 16 * Math.sin(a), r: 2 }, "sun"); } }
    else if (kind === "part") { add("circle", { cx: 18, cy: 18, r: 9 }, "sun"); cloud(2, 4); }
    else if (kind === "cloud") { cloud(); }
    else if (kind === "rain") { cloud(0, -6); [14, 23, 32].forEach((x) => add("path", { d: `M${x} 34l-3 7a2 2 0 0 0 4 0z` }, "drop")); }
    else if (kind === "snow") { cloud(0, -6); [14, 24, 34].forEach((x) => add("circle", { cx: x, cy: 38, r: 2.5 }, "snow")); }
    else if (kind === "storm") { cloud(0, -6); add("path", { d: "M25 30l-6 9h5l-2 7l8-10h-5l2-6z" }, "bolt"); }
    return s;
  }

  /* ---------- 表示 ---------- */
  let data = store.get("ouchi.last") || null;
  let checks = (data && data.date === today && data.checks) || {};

  function renderWeather() {
    const w = data && data.weather;
    const days = $("wxDays"); days.textContent = "";
    if (!w || !w.today) days.append(el("p", "empty", data ? "天気を取得できませんでした。" : "天気を読み込み中…"));
    else [["きょう", w.today], ["あした", w.tomorrow]].forEach(([lbl, d]) => {
      if (!d) return;
      const [desc, kind] = WX(d.code);
      const box = el("div", "wx-day");
      box.append(icon(kind), el("div", "lbl", lbl), el("div", "desc", desc));
      const t = el("div", "temps");
      t.append(el("span", "hi", `${Math.round(d.max)}°`), " / ", el("span", "lo", `${Math.round(d.min)}°`));
      const p = el("span", "pop", "  降水 "); p.append(el("b", null, `${d.pop ?? "—"}%`)); t.append(p);
      box.append(t); days.append(box);
    });
    const hrs = $("hours"); hrs.textContent = "";
    if (w && w.hours) {
      const now = new Date(); now.setMinutes(0, 0, 0);
      const list = w.hours.filter((h) => new Date(h.time) >= now).filter((_, i) => i % 3 === 0).slice(0, 6);
      list.forEach((h) => {
        const c = el("div"); c.append(el("div", null, `${new Date(h.time).getHours()}時`), icon(WX(h.code)[1]), el("div", "t", `${Math.round(h.temp)}°`), el("div", "p", `${h.pop ?? "—"}%`)); hrs.append(c);
      });
    }
    const cm = $("comment");
    if (data && data.comment) { cm.textContent = data.comment; cm.hidden = false; } else cm.hidden = true;
    $("place").textContent = [data && data.place, "Open-Meteo"].filter(Boolean).join(" ・ ");
  }

  function parseEv(e) {
    const s = e.allDay ? new Date(e.start + "T00:00:00") : new Date(e.start);
    const en = e.allDay ? new Date(e.end + "T00:00:00") : new Date(e.end);
    return { e, allDay: e.allDay, s, en };
  }
  function renderCalendar() {
    const todayUl = $("today"), upUl = $("upcoming"); todayUl.textContent = ""; upUl.textContent = "";
    const evs = data && data.events;
    if (!evs) { todayUl.append(el("li", "empty", data ? "カレンダーを取得できませんでした。" : "読み込み中…")); return; }
    const now = new Date(), tEv = [], uEv = [];
    evs.map(parseEv).forEach((it) => {
      if (ymd(it.s) === today || (it.s <= now && it.en > now)) tEv.push(it);
      else if (it.s > now) uEv.push(it);
    });
    tEv.sort((a, b) => (a.allDay === b.allDay ? a.s - b.s : a.allDay ? -1 : 1));
    uEv.sort((a, b) => a.s - b.s);
    if (!tEv.length) todayUl.append(el("li", "empty", "きょうの予定はありません。"));
    tEv.forEach(({ e, allDay, s, en }) => {
      const li = el("li", "ev");
      if (!allDay && en < now) li.classList.add("past");
      if (!allDay && s <= now && en > now) li.classList.add("nowon");
      li.append(el("div", "time" + (allDay ? " allday" : ""), allDay ? "終日" : hm(s)));
      const body = el("div"); body.append(el("div", "ttl", e.title || "（タイトルなし）"));
      if (e.location) body.append(el("div", "loc", e.location));
      li.append(body); todayUl.append(li);
    });
    if (!uEv.length) upUl.append(el("li", "empty", "予定はありません。"));
    uEv.slice(0, 10).forEach(({ e, allDay, s }) => {
      const li = el("li", "ev");
      li.append(el("div", "time", `${s.getMonth()+1}/${s.getDate()}(${WD[s.getDay()]})${allDay ? "" : "\n" + hm(s)}`));
      const body = el("div"); body.append(el("div", "ttl", e.title || "（タイトルなし）"));
      li.append(body); upUl.append(li);
    });
    if (data.at) { const at = new Date(data.at); $("calState").textContent = `${hm(at)} 取得`; }
  }

  const dayLabel = (r) => r.days && r.days.length && r.days.length < 7 ? r.days.map((d) => WD[d]).join("・") : "毎日";
  function renderRoutines() {
    const ul = $("routines"); ul.textContent = "";
    const all = (data && data.routines) || [];
    const dow = new Date().getDay();
    const list = all.filter((r) => r.active !== false && (!r.days || !r.days.length || r.days.includes(dow))).sort((a, b) => (a.order ?? 99) - (b.order ?? 99));
    if (!list.length) ul.append(el("li", "empty", !data ? "読み込み中…" : all.length ? "きょうのルーティンはありません。" : "まだルーティンがありません。"));
    let done = 0;
    list.forEach((r) => {
      const on = !!checks[r.id]; if (on) done++;
      const li = el("li");
      const b = el("button", "chk"); b.type = "button"; b.setAttribute("aria-pressed", String(on));
      const box = el("span", "box"); box.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      b.append(box, el("span", "label", r.title), el("span", "when", dayLabel(r)));
      b.addEventListener("click", () => toggle(r.id));
      li.append(b); ul.append(li);
    });
    $("rCount").textContent = list.length ? `${done} / ${list.length}` : "";
    $("rBar").style.width = list.length ? `${(done / list.length) * 100}%` : "0";
    if (list.length && done === list.length) ul.append(el("li", "allclear", "きょうのルーティン完了！"));
  }

  function renderNews() {
    const nl = $("news"); nl.textContent = "";
    const items = (data && data.news) || [];
    if (!items.length) nl.append(el("li", "empty", data ? "ニュースを取得できませんでした。" : "読み込み中…"));
    items.slice(0, 8).forEach((n) => {
      const li = el("li");
      if (n.url && /^https:\/\//.test(n.url)) { const a = el("a", null, n.title); a.href = n.url; a.target = "_blank"; a.rel = "noopener"; li.append(a); }
      else li.append(el("span", null, n.title));
      if (n.source) li.append(el("p", null, n.source));
      nl.append(li);
    });
  }

  function render() { renderWeather(); renderCalendar(); renderRoutines(); renderNews(); }

  /* ---------- 読み込み ---------- */
  let loading = false;
  async function refresh() {
    if (!cfg || DEMO || loading) return;
    loading = true;
    try {
      const r = await callApi({ action: "board", date: today });
      if (!r.ok) throw new Error(r.error === "bad_key" ? "合言葉が違います" : r.error);
      data = r; store.set("ouchi.last", r);
      if (!pendingChecks) checks = r.checks || {};
      render();
      $("statusText").textContent = `${hm(new Date())} 更新`;
    } catch (e) {
      $("statusText").textContent = `更新できませんでした（${e.message}）`;
    } finally { loading = false; }
  }
  setInterval(refresh, 5 * 60 * 1000);

  /* ---------- ルーティンのチェック ---------- */
  let pendingChecks = 0, queue = Promise.resolve();
  function toggle(id) {
    checks = { ...checks, [id]: !checks[id] };
    renderRoutines();
    if (DEMO) return;
    const on = checks[id], date = today;
    pendingChecks++;
    queue = queue.then(() => callApi({ action: "check", date, id, on: on ? "1" : "0" }))
      .catch(() => { $("statusText").textContent = "チェックを保存できませんでした"; })
      .finally(() => { pendingChecks--; });
  }

  /* ---------- 覚えておいて ---------- */
  const toLocalInput = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  let parsed = null;
  function updatePreview() {
    const text = $("rmText").value;
    const msg = $("rmMsg"); msg.textContent = ""; msg.className = "rm-msg";
    if (!text.trim()) { $("rmPreview").hidden = true; parsed = null; return; }
    parsed = window.parseRemind(text);
    $("rmPreview").hidden = false;
    $("rmWhat").textContent = parsed.title || "（内容を入れてください）";
    if (parsed.found) $("rmWhen").value = toLocalInput(parsed.start);
    else if (!$("rmWhen").value) { const t = new Date(); t.setDate(t.getDate() + 1); t.setHours(9, 0, 0, 0); $("rmWhen").value = toLocalInput(t); }
    if (!parsed.found) { msg.textContent = "日時が読み取れなかったので、下で選んでください。"; }
  }
  $("rmText").addEventListener("input", updatePreview);
  $("rmClear").addEventListener("click", () => { $("rmText").value = ""; $("rmWhen").value = ""; updatePreview(); });
  $("rmForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!parsed) { updatePreview(); if (!parsed) return; }
    const title = parsed.title, when = new Date($("rmWhen").value);
    const msg = $("rmMsg"); msg.className = "rm-msg";
    if (!title) { msg.textContent = "内容を入れてください。"; msg.classList.add("err"); return; }
    if (isNaN(when)) { msg.textContent = "日時を選んでください。"; msg.classList.add("err"); return; }
    const label = `${when.getMonth()+1}/${when.getDate()}(${WD[when.getDay()]}) ${hm(when)}「${title}」`;
    if (DEMO) { msg.textContent = `登録しました（試し表示）：${label}`; return; }
    $("rmAdd").disabled = true; msg.textContent = "登録しています…";
    try {
      const r = await callApi({ action: "remind", title, start: when.toISOString() });
      if (!r.ok) throw new Error(r.error);
      msg.textContent = `登録しました：${label}。その時刻にGoogleカレンダーから通知が届きます。`;
      $("rmText").value = ""; $("rmPreview").hidden = true; parsed = null;
      refresh();
    } catch (e) { msg.textContent = "登録できませんでした：" + e.message; msg.classList.add("err"); }
    finally { $("rmAdd").disabled = false; }
  });

  // 声で入力（使える端末だけボタンを出す。使えなければキーボードのマイクで）
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    const mic = $("rmMic"); mic.hidden = false;
    let rec = null;
    mic.addEventListener("click", () => {
      if (rec) { rec.stop(); return; }
      try {
        rec = new SR(); rec.lang = "ja-JP"; rec.interimResults = true; rec.continuous = false;
        const base = $("rmText").value ? $("rmText").value + " " : "";
        rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; $("rmText").value = base + t; updatePreview(); };
        rec.onerror = (e) => { $("rmMsg").textContent = e.error === "not-allowed" ? "マイクが許可されていません。キーボードのマイクボタンでも入力できます。" : "うまく聞き取れませんでした。キーボードのマイクボタンでも入力できます。"; };
        rec.onend = () => { rec = null; mic.setAttribute("aria-pressed", "false"); };
        rec.start(); mic.setAttribute("aria-pressed", "true");
      } catch (e) { rec = null; $("rmMsg").textContent = "この画面では声の入力が使えません。キーボードのマイクボタンを使ってください。"; }
    });
  }

  /* ---------- 試し表示（?demo=1） ---------- */
  function demoData() {
    const d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const at = (days, h, m) => new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + days, h, m || 0);
    const hours = []; for (let i = 0; i < 72; i++) { const t = at(0, i); hours.push({ time: toLocalInput(t), code: i % 24 < 6 ? 1 : 0, temp: 13 + 6 * Math.sin(((i % 24) - 9) / 24 * Math.PI * 2), pop: i > 40 ? 40 : 0 }); }
    const ev = (title, s, mins, loc) => ({ title, allDay: false, start: s.toISOString(), end: new Date(s.getTime() + mins * 60000).toISOString(), location: loc || "" });
    return {
      ok: true, date: today, place: "東京都日野市", at: new Date().toISOString(),
      weather: { today: { code: 2, max: 19.1, min: 7.8, pop: 0 }, tomorrow: { code: 3, max: 19, min: 11.1, pop: 20 }, hours },
      comment: "傘はいらなそうです。朝晩と日中の気温差が大きいので、羽織るものを一枚。",
      events: [ev("ゼミ", at(0, 13), 90, "研究室"), ev("買い出し", at(0, 18), 60), { title: "燃えるごみ", allDay: true, start: ymd(at(1)), end: ymd(at(2)) }, ev("パンチェッタのラップを外す", at(7, 9), 30)],
      routines: [{ id: "a", title: "風呂掃除", days: [], order: 1 }, { id: "b", title: "皿洗い", days: [], order: 2 }, { id: "c", title: "洗濯", days: [1, 3, 5], order: 3 }],
      checks: { a: true },
      news: [{ title: "ニュースの見出しがここに並びます", source: "試し表示", url: "" }, { title: "見出しをタップすると記事が開きます", source: "試し表示", url: "" }],
    };
  }

  /* ---------- 起動 ---------- */
  if (DEMO) { data = demoData(); checks = data.checks; showBoard(); render(); $("statusText").textContent = "試し表示"; return; }
  if (!cfg) { showSetup(false); return; }
  showBoard(); render(); refresh();
})();
</script>
</body>
</html>
