<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>おうちボード</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="おうちボード">
<meta name="theme-color" content="#f4f0e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Lexend:wght@100;200;300;400&display=swap">
<style>
/* 画面は3枚（ふだん／予定とルーティン／ニュース）。横にスワイプすると1枚ずつ切り替わる。 */
:root {
  --bg: #f4f0e8; --ink: #2a2723; --muted: #7d766b; --line: #dcd5c8; --soft: #ebe5d9;
  --accent: #55705f; --accent-ink: #f4f0e8; --rain: #4a6f96; --sun: #b98a2e; --warn: #a8573a;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-serif: var(--font-body);
  --font-num: "Lexend", "Zen Kaku Gothic New", system-ui, sans-serif;
  --pad-t: max(28px, env(safe-area-inset-top)); --pad-b: max(44px, env(safe-area-inset-bottom));
  --pad-l: max(32px, env(safe-area-inset-left)); --pad-r: max(32px, env(safe-area-inset-right));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151412; --ink: #e9e4da; --muted: #958d80; --line: #2f2c27; --soft: #201e1b;
    --accent: #9dbba6; --accent-ink: #151412; --rain: #8fb0d6; --sun: #dcb463; --warn: #dd8f70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151412; --ink: #e9e4da; --muted: #958d80; --line: #2f2c27; --soft: #201e1b;
  --accent: #9dbba6; --accent-ink: #151412; --rain: #8fb0d6; --sun: #dcb463; --warn: #dd8f70;
  color-scheme: dark;
}
@media (max-width: 640px) { :root { --pad-l: max(20px, env(safe-area-inset-left)); --pad-r: max(20px, env(safe-area-inset-right)); } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; transition: filter 1.2s;
}
body.night { filter: brightness(.5); }
h2 { margin: 0; font-weight: 700; font-size: 13px; letter-spacing: .14em; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
h2 small { font-family: var(--font-body); font-weight: 400; letter-spacing: 0; font-size: 12px; }

/* ページ送り */
.pager { height: 100%; display: flex; overflow: hidden; touch-action: pan-y; overscroll-behavior: none; --x: 0%; }
.page { flex: 0 0 100%; width: 100%; height: 100%; position: relative; overflow: hidden; transform: translateX(var(--x)); transition: transform .2s cubic-bezier(.2,.9,.25,1); will-change: transform; }
.pager.drag .page { transition: none; }
.page-inner { height: 100%; overflow-y: auto; padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l); scrollbar-width: none; }
.page-inner::-webkit-scrollbar { display: none; }
.dots { position: fixed; left: 0; right: 0; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 4px; z-index: 5; pointer-events: none; }
.dots button { pointer-events: auto; width: 28px; height: 20px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.dots button::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: var(--muted); opacity: .4; transition: width .3s, opacity .3s; }
.dots button[aria-current="true"]::before { width: 18px; opacity: .9; }
.dots.onphoto button::before { background: #fff; box-shadow: 0 0 4px rgba(0,0,0,.4); }

/* 1枚目：写真と時計 */
.home { background: var(--soft); }
.photo { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.4s ease; }
.photo.on { opacity: 1; }
.scrim { position: absolute; inset: 0; opacity: 0; transition: opacity 2.4s; background:
  linear-gradient(to top, rgba(12,10,8,.72) 0%, rgba(12,10,8,.28) 34%, rgba(12,10,8,0) 58%),
  linear-gradient(to bottom, rgba(12,10,8,.42) 0%, rgba(12,10,8,0) 30%); }
.home.hasphoto .scrim { opacity: 1; }
.home-inner { position: relative; height: 100%; padding: var(--pad-t) var(--pad-r) var(--pad-b) var(--pad-l); display: flex; flex-direction: column; justify-content: space-between; }
.home.hasphoto .home-inner { color: #fff; text-shadow: 0 1px 14px rgba(0,0,0,.45); }
.wx { align-self: flex-end; display: flex; align-items: center; gap: 22px; }
.wx-day { display: flex; align-items: center; gap: 10px; }
.wx-day .icon { width: 44px; height: 44px; flex: none; }
.wx-day .lbl { font-size: 12px; letter-spacing: .2em; opacity: .75; }
.wx-day .desc { font-family: var(--font-serif); font-size: 17px; line-height: 1.3; }
.wx-day .temps { font-family: var(--font-num); font-weight: 300; font-size: 15px; font-variant-numeric: tabular-nums; }
.wx-day.sub { opacity: .8; }
@media (max-width: 640px) { .wx { align-self: flex-start; } .wx-day.sub { display: none; } }
.wx-day.sub .icon { width: 32px; height: 32px; }
.clock { font-family: var(--font-num); font-weight: 200; font-size: clamp(96px, 19vw, 250px); line-height: .9; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-left: -.04em; }
.date { font-size: clamp(20px, 2.6vw, 30px); font-weight: 500; margin-top: 14px; }
.date .sub { font-size: .6em; opacity: .7; margin-left: 14px; letter-spacing: .12em; }
.next { margin-top: 18px; font-size: clamp(15px, 1.7vw, 19px); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.next .tag { font-size: 11px; letter-spacing: .25em; opacity: .7; }
.next .when { font-family: var(--font-num); font-weight: 300; }
.comment { margin-top: 6px; font-size: 14px; opacity: .8; max-width: 40em; }
.icon .sun { fill: var(--sun); } .icon .cloud { fill: var(--muted); opacity: .6; } .icon .drop { fill: var(--rain); } .icon .snow { fill: var(--rain); opacity: .7; } .icon .bolt { fill: var(--sun); }
.home.hasphoto .icon .sun, .home.hasphoto .icon .bolt { fill: #ffd98a; }
.home.hasphoto .icon .cloud { fill: #fff; opacity: .85; }
.home.hasphoto .icon .drop, .home.hasphoto .icon .snow { fill: #bcd8ff; opacity: 1; }

/* 2枚目：予定とルーティン */
.cols { display: grid; gap: 28px 56px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); min-height: 100%; align-content: start; max-width: 1400px; margin: 0 auto; }
@media (max-width: 1000px) { .cols { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } .cols .c3 { grid-column: 1 / -1; } }
@media (max-width: 640px) { .cols { grid-template-columns: minmax(0,1fr); } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.rule { border-top: 1px solid var(--line); margin: 8px 0 0; }
.ev-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ev { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 14px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .time { font-family: var(--font-num); font-weight: 300; font-variant-numeric: tabular-nums; font-size: 19px; color: var(--accent); white-space: pre-line; line-height: 1.3; }
.ev .time.allday { font-family: var(--font-body); font-size: 13px; }
.ev .ttl { font-size: 19px; font-weight: 500; overflow-wrap: anywhere; }
.ev .loc { font-size: 13px; color: var(--muted); }
.ev.past { opacity: .4; }
.ev.nowon .ttl::after { content: "いま"; margin-left: 10px; font-size: 11px; font-weight: 400; color: var(--accent-ink); background: var(--accent); border-radius: 10px; padding: 2px 8px; vertical-align: 2px; }
.upcoming .ev .time { color: var(--muted); font-family: var(--font-body); font-size: 14px; }
.upcoming .ev .ttl { font-size: 17px; font-weight: 400; }
.empty { color: var(--muted); font-size: 15px; padding: 8px 0; }

.progress { height: 2px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .5s; }
.chk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.chk { width: 100%; display: flex; align-items: center; gap: 16px; font: inherit; font-size: 20px; color: var(--ink); text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 14px 2px; cursor: pointer; min-height: 60px; }
.chk .box { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; transition: background .25s, border-color .25s; }
.chk .box svg { width: 16px; height: 16px; stroke: var(--accent-ink); stroke-width: 3; fill: none; opacity: 0; }
.chk[aria-pressed="true"] { color: var(--muted); }
.chk[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.chk[aria-pressed="true"] .box svg { opacity: 1; }
.chk[aria-pressed="true"] .label { text-decoration: line-through; text-decoration-color: var(--line); }
.chk .when { margin-left: auto; font-size: 12px; color: var(--muted); }
.allclear { text-align: center; font-family: var(--font-serif); color: var(--accent); padding: 14px; letter-spacing: .15em; }

.hours { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 4px; text-align: center; font-size: 12px; color: var(--muted); }
.hours .icon { width: 28px; height: 28px; margin: 4px auto; display: block; }
.hours .t { font-family: var(--font-num); font-weight: 300; color: var(--ink); font-size: 16px; }
.hours .p { font-family: var(--font-num); color: var(--rain); }

.remember { display: flex; flex-direction: column; gap: 10px; }
.rm-row { display: flex; gap: 8px; }
.rm-row input[type=text] { flex: 1; min-width: 0; }
input, .btn { font: inherit; font-size: 16px; }
input[type=text], input[type=datetime-local], input[type=url] { color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--muted); border-radius: 0; padding: 10px 2px; min-height: 46px; }
input::placeholder { color: var(--muted); opacity: .8; }
.btn { color: var(--ink); background: var(--soft); border: 0; border-radius: 23px; padding: 8px 18px; min-height: 46px; cursor: pointer; white-space: nowrap; }
.btn.primary { color: var(--accent-ink); background: var(--accent); }
.btn:disabled { opacity: .5; }
.btn.mic { padding: 8px 14px; }
.btn.mic[aria-pressed="true"] { color: #fff; background: var(--warn); }
.btn:focus-visible, .chk:focus-visible, input:focus-visible, .dots button:focus-visible, .news-list a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rm-preview { background: var(--soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.rm-preview .what { font-weight: 700; overflow-wrap: anywhere; }
.rm-msg { font-size: 13px; color: var(--muted); min-height: 1em; }
.rm-msg.err { color: var(--warn); }

/* 3枚目：ニュース */
.news-wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
.news-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 56px; counter-reset: n; }
@media (max-width: 760px) { .news-list { grid-template-columns: minmax(0,1fr); } }
.news-list li { counter-increment: n; display: grid; grid-template-columns: 34px minmax(0,1fr); gap: 4px 10px; padding: 16px 0; border-bottom: 1px solid var(--line); align-content: start; }
.news-list li::before { content: counter(n, decimal-leading-zero); font-family: var(--font-num); font-weight: 200; font-size: 20px; color: var(--muted); grid-row: span 2; }
.news-list a, .news-list .t { color: var(--ink); text-decoration: none; font-family: var(--font-serif); font-weight: 500; font-size: clamp(16px, 1.8vw, 20px); line-height: 1.5; }
.news-list p { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.foot button { font: inherit; color: inherit; background: none; border: 0; padding: 10px 4px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* はじめの設定 */
.setup { max-width: 560px; margin: 0 auto; padding: calc(var(--pad-t) + 6vh) 24px 40px; display: flex; flex-direction: column; gap: 16px; height: 100%; overflow-y: auto; }
.setup label { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: var(--muted); }
.setup p { margin: 0; font-size: 14px; }
.setup .ok { color: var(--accent); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<section class="setup" id="setup" hidden aria-label="初回設定">
  <h2>はじめの設定</h2>
  <p>Google Apps Script で公開した「ウェブアプリのURL」と「合言葉」を入れてください。手順は docs/設定手順.md にあります。</p>
  <label>ウェブアプリのURL<input type="url" id="cfgApi" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
  <label>合言葉<input type="text" id="cfgKey" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <div class="rm-row"><button class="btn primary" type="button" id="cfgSave">保存してつなぐ</button><button class="btn" type="button" id="cfgCancel" hidden>やめる</button></div>
  <p class="rm-msg" id="cfgMsg"></p>
</section>

<main class="pager" id="pager" hidden>
  <section class="page home" id="home" aria-label="時計と天気">
    <div class="photo" id="photoA"></div><div class="photo" id="photoB"></div><div class="scrim"></div>
    <div class="home-inner">
      <div class="wx" id="wx"></div>
      <div>
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
        <div class="next" id="next"></div>
        <div class="comment" id="comment" hidden></div>
      </div>
    </div>
  </section>

  <section class="page" aria-label="予定とルーティン">
    <div class="page-inner"><div class="cols">
      <div class="col">
        <h2>きょうの予定 <small id="calState"></small></h2>
        <ul class="ev-list" id="today"><li class="empty">読み込み中…</li></ul>
        <h2 style="margin-top:14px">この先一週間</h2>
        <ul class="ev-list upcoming" id="upcoming"></ul>
      </div>
      <div class="col">
        <h2>きょうのルーティン <small id="rCount"></small></h2>
        <div class="progress"><i id="rBar"></i></div>
        <ul class="chk-list" id="routines"><li class="empty">読み込み中…</li></ul>
      </div>
      <div class="col c3">
        <h2>覚えておいて</h2>
        <form class="remember" id="rmForm" autocomplete="off">
          <div class="rm-row">
            <input type="text" id="rmText" placeholder="1週間後にパンチェッタのラップを外す" enterkeyhint="done" aria-label="覚えておいてほしいこと">
            <button class="btn mic" type="button" id="rmMic" hidden aria-pressed="false" aria-label="声で入力">🎤</button>
          </div>
          <div class="rm-preview" id="rmPreview" hidden>
            <div class="what" id="rmWhat"></div>
            <input type="datetime-local" id="rmWhen" aria-label="日時">
            <div class="rm-row"><button class="btn primary" type="submit" id="rmAdd">カレンダーに登録</button><button class="btn" type="button" id="rmClear">やめる</button></div>
          </div>
          <div class="rm-msg" id="rmMsg"></div>
        </form>
        <h2 style="margin-top:14px">これからの天気 <small id="place"></small></h2>
        <div class="hours" id="hours"></div>
      </div>
    </div></div>
  </section>

  <section class="page" aria-label="ニュース">
    <div class="page-inner"><div class="news-wrap">
      <h2>ニュース</h2>
      <ul class="news-list" id="news"><li class="empty">読み込み中…</li></ul>
      <div class="foot"><span id="statusText"></span><button type="button" id="openSetup">設定</button></div>
    </div></div>
  </section>
</main>

<nav class="dots" id="dots" hidden aria-label="画面の切り替え">
  <button type="button" aria-label="時計" aria-current="true"></button>
  <button type="button" aria-label="予定とルーティン"></button>
  <button type="button" aria-label="ニュース"></button>
</nav>

<script src="remind-parse.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const WD = ["日","月","火","水","木","金","土"];
  const PHOTO_EVERY = 5 * 60 * 1000;   // 写真を切り替える間隔
  const IDLE_BACK = 3 * 60 * 1000;     // さわらないと1枚目に戻るまでの時間
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const hm = (d) => `${d.getHours()}:${pad(d.getMinutes())}`;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };

  /* ---------- 設定（URL の ?c= か、保存済みのもの） ---------- */
  const params = new URLSearchParams(location.search);
  const DEMO = params.get("demo") === "1";
  function decodeCfg(s) {
    try { const j = JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))))); return j && j.api && j.key ? j : null; } catch (e) { return null; }
  }
  function encodeCfg(c) { return btoa(unescape(encodeURIComponent(JSON.stringify(c)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
  let cfg = (params.get("c") && decodeCfg(params.get("c"))) || store.get("ouchi.cfg");
  if (cfg) store.set("ouchi.cfg", cfg);

  function showSetup(canCancel) {
    $("pager").hidden = true; $("dots").hidden = true; $("setup").hidden = false;
    $("cfgCancel").hidden = !canCancel;
    if (cfg) { $("cfgApi").value = cfg.api; $("cfgKey").value = cfg.key; }
  }
  function showBoard() { $("setup").hidden = true; $("pager").hidden = false; $("dots").hidden = false; }

  $("cfgSave").addEventListener("click", async () => {
    const api = $("cfgApi").value.trim(), key = $("cfgKey").value.trim();
    const msg = $("cfgMsg"); msg.className = "rm-msg";
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(api) || !key) { msg.textContent = "URL（…/exec で終わるもの）と合言葉を入れてください。"; msg.classList.add("err"); return; }
    msg.textContent = "つないでいます…";
    try {
      const r = await callApi({ action: "ping" }, { api, key });
      if (!r.ok) throw new Error(r.error === "bad_key" ? "合言葉が違います" : r.error);
      cfg = { api, key }; store.set("ouchi.cfg", cfg);
      // この URL のままホーム画面に追加すると、アプリ側にも設定が入る
      history.replaceState(null, "", location.pathname + "?c=" + encodeCfg(cfg));
      msg.innerHTML = '<span class="ok">つながりました。</span> Safari で見ている場合は、このまま 共有 →「ホーム画面に追加」をしてください。';
      setTimeout(() => { showBoard(); refresh(); }, 1500);
    } catch (e) { msg.textContent = "つなげませんでした：" + e.message; msg.classList.add("err"); }
  });
  $("cfgCancel").addEventListener("click", showBoard);
  $("openSetup").addEventListener("click", () => showSetup(true));

  /* ---------- 裏方（Apps Script）を呼ぶ ---------- */
  async function callApi(q, c) {
    c = c || cfg;
    const u = new URL(c.api);
    Object.entries({ ...q, key: c.key }).forEach(([k, v]) => u.searchParams.set(k, v));
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 30000);
    try {
      const res = await fetch(u.toString(), { redirect: "follow", signal: ctl.signal });
      if (!res.ok) throw new Error("通信エラー " + res.status);
      return await res.json();
    } finally { clearTimeout(timer); }
  }

  /* ---------- ページ送り ---------- */
  const pager = $("pager"), dots = [...$("dots").children];
  let page = 0;
  function goTo(i, instant) {
    page = Math.max(0, Math.min(2, i));
    if (instant) { pager.classList.add("drag"); requestAnimationFrame(() => requestAnimationFrame(() => pager.classList.remove("drag"))); }
    pager.style.setProperty("--x", `${-page * 100}%`);
    dots.forEach((d, k) => d.setAttribute("aria-current", String(k === page)));
    updateDotsTone();
  }
  function updateDotsTone() { $("dots").classList.toggle("onphoto", page === 0 && $("home").classList.contains("hasphoto")); }
  dots.forEach((d, k) => d.addEventListener("click", () => goTo(k)));
  document.addEventListener("keydown", (e) => {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowRight") goTo(page + 1); else if (e.key === "ArrowLeft") goTo(page - 1);
  });
  // 横スワイプ：指について動き、離すと短い時間でとなりの画面へ。軽くはじくだけでも移る
  let sw = null;
  pager.addEventListener("pointerdown", (e) => {
    if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || (e.pointerType === "mouse" && e.button !== 0)) return;
    sw = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, on: false };
  });
  pager.addEventListener("pointermove", (e) => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.on) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dy) > Math.abs(dx)) { sw = null; return; }   // 縦の動きはページ内のスクロールに任せる
      sw.on = true; pager.classList.add("drag");
      try { pager.setPointerCapture(e.pointerId); } catch (err) {}
    }
    const edge = (page === 0 && dx > 0) || (page === 2 && dx < 0);
    sw.dx = edge ? dx * .25 : dx;
    pager.style.setProperty("--x", `calc(${-page * 100}% + ${sw.dx}px)`);
  });
  function endSwipe(e) {
    if (!sw || e.pointerId !== sw.id) return;
    const s0 = sw; sw = null;
    if (!s0.on) return;
    pager.classList.remove("drag");
    const v = s0.dx / Math.max(1, performance.now() - s0.t);   // px/ms
    const far = Math.abs(s0.dx) > pager.clientWidth * .18 || Math.abs(v) > .25;
    goTo(far ? page + (s0.dx < 0 ? 1 : -1) : page);
    // スワイプのあとの指離しでボタンが押されないようにする
    const eat = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
    addEventListener("click", eat, { capture: true, once: true });
    setTimeout(() => removeEventListener("click", eat, { capture: true }), 60);
  }
  pager.addEventListener("pointerup", endSwipe);
  pager.addEventListener("pointercancel", (e) => { if (sw && e.pointerId === sw.id) { const on = sw.on; sw = null; if (on) { pager.classList.remove("drag"); goTo(page); } } });
  // しばらくさわらなければ1枚目に戻る
  let idleTimer = null;
  function touchIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {

      else if (page !== 0) touchIdle();
    }, IDLE_BACK);
  }
  ["pointerdown", "keydown", "input"].forEach((t) => document.addEventListener(t, touchIdle, { passive: true }));

  /* ---------- 時計 ---------- */
  let today = ymd(new Date());
  function tick() {
    const d = new Date();
    $("clock").textContent = hm(d);
    const dEl = $("date"); dEl.textContent = "";
    dEl.append(`${d.getMonth()+1}月${d.getDate()}日　${WD[d.getDay()]}曜日`, el("span", "sub", `令和${d.getFullYear()-2018}年`));
    const h = d.getHours();
    document.body.classList.toggle("night", h >= 23 || h < 6);

    else renderNext();

  // 画面をつけたままにする（対応している端末だけ）
  let lock = null;
  async function wake() { try { if (navigator.wakeLock && document.visibilityState === "visible" && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => { lock = null; }); } } catch (e) {} }
  document.addEventListener("visibilitychange", () => { wake(); if (document.visibilityState === "visible") refresh(); });
  document.addEventListener("click", wake, { once: true });
  wake();

  /* ---------- 天気アイコン ---------- */
  const WX = (c) => {
    if (c === 0) return ["快晴", "sun"]; if (c === 1) return ["晴れ", "sun"]; if (c === 2) return ["晴れ時々くもり", "part"]; if (c === 3) return ["くもり", "cloud"];
    if (c === 45 || c === 48) return ["霧", "cloud"]; if (c >= 51 && c <= 57) return ["霧雨", "rain"]; if (c >= 61 && c <= 67) return [c >= 65 ? "強い雨" : "雨", "rain"];
    if (c >= 71 && c <= 77) return ["雪", "snow"]; if (c >= 80 && c <= 82) return ["にわか雨", "rain"]; if (c === 85 || c === 86) return ["にわか雪", "snow"];
    if (c >= 95) return ["雷雨", "storm"]; return ["—", "cloud"];
  };
  const NS = "http://www.w3.org/2000/svg";
  function icon(kind) {
    const s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 48 48"); s.setAttribute("class", "icon"); s.setAttribute("aria-hidden", "true");
    const add = (tag, attrs, c) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); e.setAttribute("class", c); s.append(e); };
    const cloud = (dx = 0, dy = 0) => add("path", { d: `M${14+dx} ${34+dy}h22a8 8 0 0 0 0-16a11 11 0 0 0-21 3a6.5 6.5 0 0 0-1 13z` }, "cloud");
    if (kind === "sun") { add("circle", { cx: 24, cy: 24, r: 10 }, "sun"); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; add("circle", { cx: 24 + 16 * Math.cos(a), cy: 24 + 16 * Math.sin(a), r: 2 }, "sun"); } }
    else if (kind === "part") { add("circle", { cx: 18, cy: 18, r: 9 }, "sun"); cloud(2, 4); }
    else if (kind === "cloud") { cloud(); }
    else if (kind === "rain") { cloud(0, -6); [14, 23, 32].forEach((x) => add("path", { d: `M${x} 34l-3 7a2 2 0 0 0 4 0z` }, "drop")); }
    else if (kind === "snow") { cloud(0, -6); [14, 24, 34].forEach((x) => add("circle", { cx: x, cy: 38, r: 2.5 }, "snow")); }
    else if (kind === "storm") { cloud(0, -6); add("path", { d: "M25 30l-6 9h5l-2 7l8-10h-5l2-6z" }, "bolt"); }
    return s;
  }

  /* ---------- 表示 ---------- */
  let data = store.get("ouchi.last") || null;

  function renderWeather() {

  function parseEv(e) {
    const s = e.allDay ? new Date(e.start + "T00:00:00") : new Date(e.start);

  function splitEvents() {
    const now = new Date(), tEv = [], uEv = [];

    tEv.sort((a, b) => (a.allDay === b.allDay ? a.s - b.s : a.allDay ? -1 : 1));

  function renderCalendar() {
    const todayUl = $("today"), upUl = $("upcoming"); todayUl.textContent = ""; upUl.textContent = "";

  /* ---------- 写真（ドライブのフォルダから順に表示） ---------- */
  let photoIds = [], photoOrder = [], photoTimer = null, photoFront = 0, photoBusy = false, demoPhotos = null;
  const layers = [$("photoA"), $("photoB")];
  function showPhoto(url) {
    const img = new Image();
    img.onload = () => {
      const back = layers[1 - photoFront];
      back.style.backgroundImage = `url("${url}")`;

      $("home").classList.add("hasphoto"); updateDotsTone();

  async function nextPhoto() {

    if (!photoIds.length) { clearPhoto(); return; }
    if (!photoOrder.length) photoOrder = photoIds.slice().sort(() => Math.random() - .5);
    const id = photoOrder.pop();
    photoBusy = true;
    try {
      const r = await callApi({ action: "photo", id });

  /* ---------- 試し表示（?demo=1 写真なしは &photo=0） ---------- */
  function demoPhoto(seed) {
    const c = document.createElement("canvas"); c.width = 1600; c.height = 1100;
    const g = c.getContext("2d");
    const sky = g.createLinearGradient(0, 0, 0, 1100);
    (seed ? ["#27384f", "#7b6d86", "#e3a57c", "#f1d3a4"] : ["#9db8c9", "#d5dcd4", "#e9dcc3", "#c9b79a"]).forEach((col, i) => sky.addColorStop(i / 3, col));
    g.fillStyle = sky; g.fillRect(0, 0, 1600, 1100);
    [[.62, seed ? "#3c3a4c" : "#8fa39a"], [.74, seed ? "#2b2a38" : "#6f877c"], [.86, seed ? "#1c1b25" : "#4f6659"]].forEach(([y, col], k) => {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, 1100);
      for (let x = 0; x <= 1600; x += 40) g.lineTo(x, 1100 * y + Math.sin(x / (170 + k * 60) + k * 2 + seed) * (60 - k * 12) + Math.sin(x / 67 + k) * 14);
      g.lineTo(1600, 1100); g.fill();
    });
    return c.toDataURL("image/jpeg", .85);
  }

    const ev = (title, s, mins, loc) => ({ title, allDay: false, start: s.toISOString(), end: new Date(s.getTime() + mins * 60000).toISOString(), location: loc || "" });
    return {
      ok: true, date: today, place: "東京都日野市", at: new Date().toISOString(),
      weather: { today: { code: 2, max: 19.1, min: 7.8, pop: 0 }, tomorrow: { code: 3, max: 19, min: 11.1, pop: 20 }, hours },
      comment: "傘はいらなそうです。朝晩と日中の気温差が大きいので、羽織るものを一枚。",

      routines: [{ id: "a", title: "風呂掃除", days: [], order: 1 }, { id: "b", title: "皿洗い", days: [], order: 2 }, { id: "c", title: "洗濯", days: [1, 3, 5], order: 3 }],
      checks: { a: true },
      news: ["ニュースの見出しがここに並びます", "見出しをタップすると記事が開きます", "少し大きめの文字で表示します", "一度に8件まで", "三分さわらなければ時計の画面に戻ります", "横にスワイプで画面が切り替わります"].map((t) => ({ title: t, source: "試し表示", url: "" })),
    };
  }

  /* ---------- 起動 ---------- */
  setInterval(tick, 10000);
  if (DEMO) {
    data = demoData(); checks = data.checks; showBoard(); tick(); render();
    $("statusText").textContent = "試し表示";
    if (params.get("photo") !== "0") { demoPhotos = [demoPhoto(1), demoPhoto(0)]; nextPhoto(); setInterval(nextPhoto, 8000); }
    const p = Number(params.get("page")); if (p) goTo(p, true);
    return;
  }
  if (!cfg) { showSetup(false); return; }
  showBoard(); tick(); render();
  const lastPhoto = store.get("ouchi.photo"); if (lastPhoto) showPhoto(lastPhoto);
  refresh(); setInterval(refresh, 5 * 60 * 1000);
})();
</script>
